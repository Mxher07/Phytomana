# .github/workflows/manual-build.yml
name: Manual Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: master
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Cache NuGet
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('Phytomana/Phytomana.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Restore
      run: dotnet restore Phytomana/Phytomana.csproj
    
    - name: Build
      run: dotnet build Phytomana/Phytomana.csproj --configuration Release --no-restore
    
    - name: Upload scmod artifact
      uses: actions/upload-artifact@v4
      with:
        name: Phytomana
        path: Phytomana/bin/Release/Phytomana.scmod